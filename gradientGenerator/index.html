<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>渐变背景生成器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .card {
      background: #fff;
      width: 92%;
      max-width: 640px;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 6px; font-size: 22px; text-align: center; }
    .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
    .preview {
      height: 160px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; }
    input[type="text"], input[type="number"], select {
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15); }
    .color-row { display: flex; align-items: center; gap: 8px; }
    input[type="color"] {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: none;
    }
    .angle-row { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { flex: 1; cursor: pointer; }
    .code-box {
      position: relative;
      margin-bottom: 10px;
    }
    .code-box textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      resize: vertical;
    }
    .actions { display: flex; gap: 10px; }
    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #5568d3; }
    button:active { transform: scale(0.98); }
    button.secondary { background: #f0f2f5; color: #555; }
    button.secondary:hover { background: #e2e5e9; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 540px) {
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>渐变背景生成器</h1>
    <p class="subtitle">选择颜色和角度，生成 CSS 渐变代码</p>

    <div class="preview" id="preview">渐变预览</div>

    <div class="controls">
      <div class="field">
        <label>渐变类型</label>
        <select id="gradientType">
          <option value="linear">线性渐变</option>
          <option value="radial">径向渐变</option>
        </select>
      </div>
      <div class="field" id="angleField">
        <label>角度</label>
        <div class="angle-row">
          <input id="angle" type="range" min="0" max="360" value="135" />
          <span id="angleValue">135°</span>
        </div>
      </div>
      <div class="field">
        <label>起始颜色</label>
        <div class="color-row">
          <input id="color1" type="color" value="#667eea" />
          <input id="color1Text" type="text" value="#667eea" />
        </div>
      </div>
      <div class="field">
        <label>结束颜色</label>
        <div class="color-row">
          <input id="color2" type="color" value="#764ba2" />
          <input id="color2Text" type="text" value="#764ba2" />
        </div>
      </div>
    </div>

    <div class="code-box">
      <label>CSS 代码</label>
      <textarea id="cssOutput" readonly></textarea>
    </div>

    <div class="actions">
      <button id="copyBtn" type="button">复制 CSS</button>
      <button id="randomBtn" type="button" class="secondary">随机颜色</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const preview = document.getElementById('preview');
    const gradientType = document.getElementById('gradientType');
    const angle = document.getElementById('angle');
    const angleValue = document.getElementById('angleValue');
    const angleField = document.getElementById('angleField');
    const color1 = document.getElementById('color1');
    const color1Text = document.getElementById('color1Text');
    const color2 = document.getElementById('color2');
    const color2Text = document.getElementById('color2Text');
    const cssOutput = document.getElementById('cssOutput');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function update() {
      const type = gradientType.value;
      const c1 = color1.value;
      const c2 = color2.value;
      let gradient;

      if (type === 'linear') {
        gradient = `linear-gradient(${angle.value}deg, ${c1}, ${c2})`;
        angleField.style.display = 'flex';
        angleField.style.flexDirection = 'column';
      } else {
        gradient = `radial-gradient(circle, ${c1}, ${c2})`;
        angleField.style.display = 'none';
      }

      preview.style.background = gradient;
      cssOutput.value = `background: ${gradient};`;
      angleValue.textContent = angle.value + '°';
    }

    function syncColorFromText(input, picker) {
      const val = input.value.trim();
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        picker.value = val;
        update();
      }
    }

    gradientType.addEventListener('change', update);
    angle.addEventListener('input', update);
    color1.addEventListener('input', () => { color1Text.value = color1.value; update(); });
    color2.addEventListener('input', () => { color2Text.value = color2.value; update(); });
    color1Text.addEventListener('input', () => syncColorFromText(color1Text, color1));
    color2Text.addEventListener('input', () => syncColorFromText(color2Text, color2));

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(cssOutput.value);
        showToast('已复制 CSS');
      } catch (err) {
        cssOutput.select();
        showToast('复制失败，请手动复制');
      }
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
      const randomColor = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      color1.value = randomColor();
      color2.value = randomColor();
      color1Text.value = color1.value;
      color2Text.value = color2.value;
      update();
    });

    update();
  </script>
</body>
</html>
