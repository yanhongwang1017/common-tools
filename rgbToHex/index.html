<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RGB 转十六进制颜色转换器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .card {
      background: #fff;
      width: 92%;
      max-width: 420px;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .rgb-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .preview {
      height: 120px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .result-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    #hexOutput {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 18px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      letter-spacing: 1px;
      background: #f9f9f9;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover {
      background: #5568d3;
    }

    button:active {
      transform: scale(0.98);
    }

    .combined {
      margin-bottom: 16px;
      position: relative;
    }

    .combined input {
      width: 100%;
      padding: 12px 38px 12px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .combined input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .input-wrapper {
      position: relative;
    }

    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #ccc;
      color: #fff;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, background 0.2s;
    }

    .clear-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .clear-btn:hover {
      background: #999;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>RGB 转十六进制</h1>
    <p class="subtitle">输入 RGB 值，立即得到可复制的 HEX 颜色</p>

    <div class="preview" id="preview">颜色预览</div>

    <div class="rgb-group">
      <div class="field">
        <label for="r">R</label>
        <input id="r" type="number" min="0" max="255" value="102" placeholder="0-255" />
      </div>
      <div class="field">
        <label for="g">G</label>
        <input id="g" type="number" min="0" max="255" value="126" placeholder="0-255" />
      </div>
      <div class="field">
        <label for="b">B</label>
        <input id="b" type="number" min="0" max="255" value="234" placeholder="0-255" />
      </div>
    </div>

    <div class="combined">
      <label for="rgbCombined">或输入 RGB 字符串</label>
      <div class="input-wrapper">
        <input id="rgbCombined" type="text" placeholder="例如：102, 126, 234 或 rgb(102, 126, 234)" />
        <button id="clearBtn" class="clear-btn" type="button" title="清空">×</button>
      </div>
    </div>

    <div class="result-row">
      <input id="hexOutput" type="text" readonly value="#667EEA" />
      <button id="copyBtn" type="button">复制</button>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

  <script>
    const rInput = document.getElementById('r');
    const gInput = document.getElementById('g');
    const bInput = document.getElementById('b');
    const rgbCombined = document.getElementById('rgbCombined');
    const hexOutput = document.getElementById('hexOutput');
    const preview = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const toast = document.getElementById('toast');

    function clamp(value) {
      return Math.max(0, Math.min(255, value));
    }

    function componentToHex(c) {
      const hex = c.toString(16);
      return hex.length === 1 ? '0' + hex : hex;
    }

    function rgbToHex(r, g, b) {
      return ('#' + componentToHex(r) + componentToHex(g) + componentToHex(b)).toUpperCase();
    }

    function getBrightness(r, g, b) {
      return (r * 299 + g * 587 + b * 114) / 1000;
    }

    function updateFromInputs() {
      const r = clamp(parseInt(rInput.value, 10) || 0);
      const g = clamp(parseInt(gInput.value, 10) || 0);
      const b = clamp(parseInt(bInput.value, 10) || 0);

      rInput.value = r;
      gInput.value = g;
      bInput.value = b;
      rgbCombined.value = '';

      render(r, g, b);
    }

    function parseRgbString(str) {
      const match = str.match(/rgba?\s*\(?\s*(\d{1,3})\s*,?\s*(\d{1,3})\s*,?\s*(\d{1,3})/i);
      if (!match) return null;
      return {
        r: clamp(parseInt(match[1], 10)),
        g: clamp(parseInt(match[2], 10)),
        b: clamp(parseInt(match[3], 10))
      };
    }

    function toggleClearBtn() {
      clearBtn.classList.toggle('visible', rgbCombined.value.length > 0);
    }

    function clearCombined() {
      rgbCombined.value = '';
      toggleClearBtn();
      rgbCombined.focus();
    }

    function updateFromCombined() {
      toggleClearBtn();
      const parsed = parseRgbString(rgbCombined.value);
      if (!parsed) return;
      rInput.value = parsed.r;
      gInput.value = parsed.g;
      bInput.value = parsed.b;
      render(parsed.r, parsed.g, parsed.b);
    }

    function render(r, g, b) {
      const hex = rgbToHex(r, g, b);
      hexOutput.value = hex;
      preview.style.backgroundColor = hex;
      preview.style.color = getBrightness(r, g, b) > 128 ? '#222' : '#fff';
      preview.textContent = hex;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(hexOutput.value);
        showToast('已复制到剪贴板');
      } catch (err) {
        hexOutput.select();
        showToast('复制失败，请手动复制');
      }
    });

    [rInput, gInput, bInput].forEach(input => {
      input.addEventListener('input', updateFromInputs);
    });

    rgbCombined.addEventListener('input', updateFromCombined);
    clearBtn.addEventListener('click', clearCombined);

    updateFromInputs();
  </script>
</body>
</html>
