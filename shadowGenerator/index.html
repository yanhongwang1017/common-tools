<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阴影生成器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .card {
      background: #fff;
      width: 92%;
      max-width: 640px;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 6px; font-size: 22px; text-align: center; }
    .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
    .preview-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 160px;
      border: 2px dashed #e0e0e0;
      border-radius: 14px;
      margin-bottom: 20px;
      background: #f7f8fa;
    }
    .preview-box {
      width: 120px;
      height: 120px;
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #555;
    }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; }
    input[type="range"] { width: 100%; cursor: pointer; }
    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-value { width: 48px; text-align: right; font-size: 13px; color: #667eea; font-weight: 600; }
    input[type="color"] {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: none;
    }
    input[type="text"] {
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
    }
    .code-box { margin-bottom: 10px; }
    .code-box textarea {
      width: 100%;
      min-height: 70px;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      resize: vertical;
    }
    .actions { display: flex; gap: 10px; }
    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #5568d3; }
    button:active { transform: scale(0.98); }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 540px) {
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>阴影生成器</h1>
    <p class="subtitle">调节参数，生成 box-shadow CSS 代码</p>

    <div class="preview-wrap">
      <div class="preview-box" id="previewBox">预览</div>
    </div>

    <div class="controls">
      <div class="field">
        <label>水平偏移 X</label>
        <div class="range-row">
          <input id="offsetX" type="range" min="-50" max="50" value="10" />
          <span class="range-value" id="offsetXValue">10px</span>
        </div>
      </div>
      <div class="field">
        <label>垂直偏移 Y</label>
        <div class="range-row">
          <input id="offsetY" type="range" min="-50" max="50" value="10" />
          <span class="range-value" id="offsetYValue">10px</span>
        </div>
      </div>
      <div class="field">
        <label>模糊半径</label>
        <div class="range-row">
          <input id="blur" type="range" min="0" max="80" value="20" />
          <span class="range-value" id="blurValue">20px</span>
        </div>
      </div>
      <div class="field">
        <label>扩散半径</label>
        <div class="range-row">
          <input id="spread" type="range" min="-20" max="40" value="0" />
          <span class="range-value" id="spreadValue">0px</span>
        </div>
      </div>
      <div class="field">
        <label for="shadowColor">阴影颜色</label>
        <input id="shadowColor" type="color" value="#000000" />
      </div>
      <div class="field">
        <label for="shadowColorText">颜色值 / 透明度</label>
        <input id="shadowColorText" type="text" value="rgba(0,0,0,0.3)" />
      </div>
    </div>

    <div class="code-box">
      <label>CSS 代码</label>
      <textarea id="cssOutput" readonly></textarea>
    </div>

    <div class="actions">
      <button id="copyBtn" type="button">复制 CSS</button>
      <button id="resetBtn" type="button" class="secondary" style="background:#f0f2f5;color:#555;">重置</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const previewBox = document.getElementById('previewBox');
    const offsetX = document.getElementById('offsetX');
    const offsetY = document.getElementById('offsetY');
    const blur = document.getElementById('blur');
    const spread = document.getElementById('spread');
    const shadowColor = document.getElementById('shadowColor');
    const shadowColorText = document.getElementById('shadowColorText');
    const cssOutput = document.getElementById('cssOutput');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function parseRgba(text) {
      const match = text.match(/rgba?\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+))?\s*\)/);
      if (!match) return null;
      return {
        r: parseInt(match[1], 10),
        g: parseInt(match[2], 10),
        b: parseInt(match[3], 10),
        a: match[4] !== undefined ? parseFloat(match[4]) : 1
      };
    }

    function rgbaToHex(rgba) {
      const toHex = n => n.toString(16).padStart(2, '0');
      return '#' + toHex(rgba.r) + toHex(rgba.g) + toHex(rgba.b);
    }

    function getAlpha(text) {
      const rgba = parseRgba(text);
      return rgba ? rgba.a : 0.3;
    }

    function update() {
      const x = offsetX.value;
      const y = offsetY.value;
      const b = blur.value;
      const s = spread.value;
      const alpha = getAlpha(shadowColorText.value);
      const color = hexToRgba(shadowColor.value, alpha);

      const shadow = `${x}px ${y}px ${b}px ${s}px ${color}`;
      previewBox.style.boxShadow = shadow;
      cssOutput.value = `box-shadow: ${shadow};`;

      document.getElementById('offsetXValue').textContent = x + 'px';
      document.getElementById('offsetYValue').textContent = y + 'px';
      document.getElementById('blurValue').textContent = b + 'px';
      document.getElementById('spreadValue').textContent = s + 'px';
    }

    [offsetX, offsetY, blur, spread].forEach(el => el.addEventListener('input', update));

    shadowColor.addEventListener('input', () => {
      const alpha = getAlpha(shadowColorText.value);
      shadowColorText.value = hexToRgba(shadowColor.value, alpha);
      update();
    });

    shadowColorText.addEventListener('input', () => {
      const rgba = parseRgba(shadowColorText.value);
      if (rgba) {
        shadowColor.value = rgbaToHex(rgba);
      }
      update();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(cssOutput.value);
        showToast('已复制 CSS');
      } catch (err) {
        cssOutput.select();
        showToast('复制失败，请手动复制');
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      offsetX.value = 10;
      offsetY.value = 10;
      blur.value = 20;
      spread.value = 0;
      shadowColor.value = '#000000';
      shadowColorText.value = 'rgba(0, 0, 0, 0.3)';
      update();
    });

    update();
  </script>
</body>
</html>
