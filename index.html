<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>常用工具合集</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f6f8;
      color: #333;
    }

    .app {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    .sidebar-header h1 {
      margin: 0;
      font-size: 18px;
      color: #222;
    }

    .sidebar-header p {
      margin: 6px 0 0;
      font-size: 12px;
      color: #888;
    }

    .tool-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      list-style: none;
      margin: 0;
    }

    .tool-item {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #555;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .tool-item:hover {
      background: #f0f2f5;
    }

    .tool-item.active {
      background: #667eea;
      color: #fff;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: none;
      align-items: center;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      gap: 12px;
    }

    .menu-toggle {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: #f0f2f5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 600;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #f5f6f8;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.1);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 99;
      }

      .overlay.show {
        display: block;
      }

      .topbar {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>常用工具合集</h1>
        <p>按工具分文件夹，点击切换</p>
      </div>
      <ul class="tool-list" id="toolList"></ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <div class="topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="切换菜单">☰</button>
        <span class="topbar-title" id="topbarTitle">常用工具合集</span>
      </div>
      <iframe id="toolFrame" title="工具内容"></iframe>
    </main>
  </div>

  <script>
    const tools = [
      { id: 'rgbToHex', name: 'RGB 转 Hex', path: './rgbToHex/index.html' },
      { id: 'imageCompressor', name: '图片压缩', path: './imageCompressor/index.html' },
      { id: 'urlCodec', name: 'URL 编解码', path: './urlCodec/index.html' }
    ];

    const toolList = document.getElementById('toolList');
    const toolFrame = document.getElementById('toolFrame');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuToggle = document.getElementById('menuToggle');
    const topbarTitle = document.getElementById('topbarTitle');

    let activeId = null;

    function renderMenu() {
      tools.forEach(tool => {
        const li = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'tool-item';
        button.dataset.id = tool.id;
        button.textContent = tool.name;
        button.addEventListener('click', () => loadTool(tool));
        li.appendChild(button);
        toolList.appendChild(li);
      });
    }

    function setActive(id) {
      activeId = id;
      document.querySelectorAll('.tool-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id);
      });
    }

    function loadTool(tool) {
      setActive(tool.id);
      toolFrame.src = tool.path;
      topbarTitle.textContent = tool.name;
      saveLastTool(tool.id);
      closeSidebar();
    }

    function saveLastTool(id) {
      try {
        localStorage.setItem('lastToolId', id);
      } catch (e) {
        // 忽略 localStorage 不可用的情况
      }
    }

    function getLastToolId() {
      try {
        return localStorage.getItem('lastToolId');
      } catch (e) {
        return null;
      }
    }

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    menuToggle.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);

    renderMenu();

    const lastToolId = getLastToolId();
    const lastTool = tools.find(t => t.id === lastToolId);
    if (lastTool) {
      loadTool(lastTool);
    } else if (tools.length > 0) {
      loadTool(tools[0]);
    }
  </script>
</body>
</html>
