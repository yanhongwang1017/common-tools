<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON 格式化</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .card {
      background: #fff;
      width: 100%;
      height: 100dvh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 6px; font-size: 22px; text-align: center; }
    .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .toolbar select, .toolbar input {
      padding: 8px 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 13px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5568d3; }
    button.secondary { background: #f0f2f5; color: #555; }
    button.secondary:hover { background: #e2e5e9; }
    .editors { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; gap: 14px; flex: 1; min-height: 0; }
    .field { display: flex; flex-direction: column; min-height: 0; }
    label { font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; flex-shrink: 0; }
    textarea {
      width: 100%;
      flex: 1;
      min-height: 0;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15); }
    textarea.error { border-color: #e74c3c; background: #fdf2f2; }
    .error-msg { color: #e74c3c; font-size: 12px; min-height: 18px; margin-top: 6px; }
    .json-tree {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      background: #fff;
      user-select: text;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .json-tree:empty::before {
      content: '格式化后的 JSON 将显示在这里';
      color: #aaa;
      font-style: italic;
    }
    .json-node { margin-left: 18px; }
    .json-line { line-height: 1.6; }
    .json-toggle { display: inline-block; vertical-align: middle; }
    .json-key { color: #0066cc; margin-right: 6px; }
    .json-string { color: #0d6b3e; }
    .json-number { color: #d73a49; }
    .json-boolean { color: #005cc5; font-weight: 600; }
    .json-null { color: #6f42c1; font-weight: 600; }
    .json-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-right: 4px;
      border: none;
      background: #f0f2f5;
      color: #555;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }
    .json-toggle:hover { background: #e2e5e9; }
    .json-bracket { color: #555; }
    .json-preview { color: #888; margin-left: 4px; display: none; }
    .json-inline-close { display: none; }
    .json-comma-inline { display: none; }
    .json-close { display: block; }
    .collapsed .json-preview,
    .collapsed .json-inline-close,
    .collapsed .json-comma-inline { display: inline; }
    .collapsed .json-children,
    .collapsed .json-close { display: none; }
    .json-toggle::before { content: '−'; }
    .collapsed .json-toggle::before { content: '+'; }
    .json-empty { color: #888; }
    .json-depth-limit {
      color: #888;
      font-style: italic;
    }
    @media (max-width: 720px) {
      .editors { grid-template-columns: 1fr; }
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <h1>JSON 格式化</h1>
    <p class="subtitle">粘贴 JSON，格式化或压缩</p>

    <div class="toolbar">
      <select id="indent">
        <option value="2">2 空格缩进</option>
        <option value="4">4 空格缩进</option>
        <option value="tab">Tab 缩进</option>
      </select>
      <button id="formatBtn" type="button">格式化</button>
      <button id="minifyBtn" type="button" class="secondary">压缩</button>
      <button id="copyBtn" type="button" class="secondary">复制结果</button>
      <button id="clearBtn" type="button" class="secondary">清空</button>
    </div>

    <div class="editors">
      <div class="field">
        <label for="input">输入 JSON</label>
        <textarea id="input" placeholder='{"name":"Tom","age":18}'></textarea>
        <div class="error-msg" id="errorMsg"></div>
      </div>
      <div class="field">
        <label>结果</label>
        <div id="output" class="json-tree"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const indent = document.getElementById('indent');
    const errorMsg = document.getElementById('errorMsg');
    const toast = document.getElementById('toast');
    const MAX_DEPTH = 100;

    let formattedText = '';

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function setError(msg) {
      errorMsg.textContent = msg;
      input.classList.toggle('error', !!msg);
    }

    function preview(value) {
      if (value === null) return 'null';
      if (typeof value === 'boolean') return String(value);
      if (typeof value === 'number') return String(value);
      if (typeof value === 'string') {
        const s = JSON.stringify(value);
        if (s.length > 23) return s.slice(0, 20) + '…"';
        return s;
      }
      if (Array.isArray(value)) return `Array(${value.length})`;
      return `Object(${Object.keys(value).length})`;
    }

    function renderNode(value, key, comma, depth) {
      if (key === undefined) key = undefined;
      if (comma === undefined) comma = false;
      if (depth === undefined) depth = 0;

      const node = document.createElement('div');
      node.className = 'json-node';

      const isObject = value !== null && typeof value === 'object';
      const line = document.createElement('div');
      line.className = 'json-line';

      if (isObject) {
        const open = Array.isArray(value) ? '[' : '{';
        const close = Array.isArray(value) ? ']' : '}';
        const isEmpty = Array.isArray(value) ? value.length === 0 : Object.keys(value).length === 0;
        const hasChildren = !isEmpty;

        // Depth limit: show placeholder and stop recursing
        if (hasChildren && depth >= MAX_DEPTH) {
          if (key !== undefined) {
            const keySpan = document.createElement('span');
            keySpan.className = 'json-key';
            keySpan.textContent = `"${key}": `;
            line.appendChild(keySpan);
          }
          const openSpan = document.createElement('span');
          openSpan.className = 'json-bracket';
          openSpan.textContent = open;
          line.appendChild(openSpan);
          node.appendChild(line);

          const msgLine = document.createElement('div');
          msgLine.className = 'json-line';
          msgLine.style.paddingLeft = '18px';
          const msgSpan = document.createElement('span');
          msgSpan.className = 'json-depth-limit';
          msgSpan.textContent = '... 层级过深，已停止展开';
          msgLine.appendChild(msgSpan);
          node.appendChild(msgLine);

          const closeLine = document.createElement('div');
          closeLine.className = 'json-line';
          const closeSpan = document.createElement('span');
          closeSpan.className = 'json-bracket';
          closeSpan.textContent = close;
          closeLine.appendChild(closeSpan);
          if (comma) {
            const commaSpan = document.createElement('span');
            commaSpan.className = 'json-comma';
            commaSpan.textContent = ',';
            closeLine.appendChild(commaSpan);
          }
          node.appendChild(closeLine);
          return node;
        }

        if (hasChildren) {
          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'json-toggle';
          toggle.addEventListener('click', () => node.classList.toggle('collapsed'));
          line.appendChild(toggle);
        }
      }

      if (key !== undefined) {
        const keySpan = document.createElement('span');
        keySpan.className = 'json-key';
        keySpan.textContent = `"${key}": `;
        line.appendChild(keySpan);
      }

      if (isObject) {
        const open = Array.isArray(value) ? '[' : '{';
        const close = Array.isArray(value) ? ']' : '}';
        const isEmpty = Array.isArray(value) ? value.length === 0 : Object.keys(value).length === 0;

        const openSpan = document.createElement('span');
        openSpan.className = 'json-bracket';
        openSpan.textContent = open;
        line.appendChild(openSpan);

        if (!isEmpty) {
          const previewSpan = document.createElement('span');
          previewSpan.className = 'json-preview';
          previewSpan.textContent = ' ' + preview(value) + ' ';
          line.appendChild(previewSpan);

          const inlineClose = document.createElement('span');
          inlineClose.className = 'json-bracket json-inline-close';
          inlineClose.textContent = close;
          line.appendChild(inlineClose);

          if (comma) {
            const commaInline = document.createElement('span');
            commaInline.className = 'json-comma json-comma-inline';
            commaInline.textContent = ',';
            line.appendChild(commaInline);
          }
        } else {
          const closeSpan = document.createElement('span');
          closeSpan.className = 'json-bracket';
          closeSpan.textContent = close;
          line.appendChild(closeSpan);

          if (comma) {
            const commaSpan = document.createElement('span');
            commaSpan.className = 'json-comma';
            commaSpan.textContent = ',';
            line.appendChild(commaSpan);
          }
        }

        node.appendChild(line);

        if (!isEmpty && depth < MAX_DEPTH) {
          const children = document.createElement('div');
          children.className = 'json-children';
          const keys = Array.isArray(value) ? value.map((_, i) => i) : Object.keys(value);
          const fragment = document.createDocumentFragment();
          keys.forEach((k, index) => {
            const childValue = value[k];
            fragment.appendChild(renderNode(childValue, k, index < keys.length - 1, depth + 1));
          });
          children.appendChild(fragment);
          node.appendChild(children);

          const closeLine = document.createElement('div');
          closeLine.className = 'json-line json-close';
          const closeSpan = document.createElement('span');
          closeSpan.className = 'json-bracket';
          closeSpan.textContent = close;
          closeLine.appendChild(closeSpan);
          if (comma) {
            const commaSpan = document.createElement('span');
            commaSpan.className = 'json-comma';
            commaSpan.textContent = ',';
            closeLine.appendChild(commaSpan);
          }
          node.appendChild(closeLine);
        }
      } else {
        const valSpan = document.createElement('span');
        if (value === null) valSpan.className = 'json-null';
        else if (typeof value === 'boolean') valSpan.className = 'json-boolean';
        else if (typeof value === 'number') valSpan.className = 'json-number';
        else valSpan.className = 'json-string';
        valSpan.textContent = value === null ? 'null' : (typeof value === 'string' ? JSON.stringify(value) : String(value));
        line.appendChild(valSpan);

        if (comma) {
          const commaSpan = document.createElement('span');
          commaSpan.className = 'json-comma';
          commaSpan.textContent = ',';
          line.appendChild(commaSpan);
        }

        node.appendChild(line);
      }

      return node;
    }

    function renderTree(data) {
      const fragment = document.createDocumentFragment();
      fragment.appendChild(renderNode(data, undefined, false, 0));
      output.innerHTML = '';
      output.appendChild(fragment);
    }

    function formatJSON() {
      setError('');
      if (!input.value.trim()) {
        output.innerHTML = '';
        formattedText = '';
        return;
      }
      try {
        const data = JSON.parse(input.value);
        const space = indent.value === 'tab' ? '\t' : Number(indent.value);
        formattedText = JSON.stringify(data, null, space);
        renderTree(data);
      } catch (err) {
        output.innerHTML = '';
        formattedText = '';
        setError('JSON 解析错误：' + err.message);
      }
    }

    function minifyJSON() {
      setError('');
      if (!input.value.trim()) {
        output.innerHTML = '';
        formattedText = '';
        return;
      }
      try {
        const data = JSON.parse(input.value);
        formattedText = JSON.stringify(data);
        output.textContent = formattedText;
      } catch (err) {
        output.innerHTML = '';
        formattedText = '';
        setError('JSON 解析错误：' + err.message);
      }
    }

    document.getElementById('formatBtn').addEventListener('click', formatJSON);
    document.getElementById('minifyBtn').addEventListener('click', minifyJSON);
    document.getElementById('clearBtn').addEventListener('click', () => {
      input.value = '';
      output.innerHTML = '';
      formattedText = '';
      setError('');
      input.focus();
    });
    document.getElementById('copyBtn').addEventListener('click', async () => {
      if (!formattedText) {
        showToast('暂无可复制内容');
        return;
      }
      try {
        await navigator.clipboard.writeText(formattedText);
        showToast('已复制到剪贴板');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = formattedText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制到剪贴板');
      }
    });
  </script>
</body>
</html>
