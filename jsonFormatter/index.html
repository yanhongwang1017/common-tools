<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON 格式化</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .card {
      background: #fff;
      width: 92%;
      max-width: 760px;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 6px; font-size: 22px; text-align: center; }
    .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .toolbar select, .toolbar input {
      padding: 8px 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 13px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5568d3; }
    button.secondary { background: #f0f2f5; color: #555; }
    button.secondary:hover { background: #e2e5e9; }
    .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; }
    textarea {
      width: 100%;
      flex: 1;
      min-height: 260px;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15); }
    textarea.error { border-color: #e74c3c; background: #fdf2f2; }
    .error-msg { color: #e74c3c; font-size: 12px; min-height: 18px; margin-top: 6px; }
    @media (max-width: 720px) {
      .editors { grid-template-columns: 1fr; }
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <h1>JSON 格式化</h1>
    <p class="subtitle">粘贴 JSON，格式化或压缩</p>

    <div class="toolbar">
      <select id="indent">
        <option value="2">2 空格缩进</option>
        <option value="4">4 空格缩进</option>
        <option value="\t">Tab 缩进</option>
      </select>
      <button id="formatBtn" type="button">格式化</button>
      <button id="minifyBtn" type="button" class="secondary">压缩</button>
      <button id="copyBtn" type="button" class="secondary">复制结果</button>
      <button id="clearBtn" type="button" class="secondary">清空</button>
    </div>

    <div class="editors">
      <div class="field">
        <label for="input">输入 JSON</label>
        <textarea id="input" placeholder='{"name":"Tom","age":18}'></textarea>
      </div>
      <div class="field">
        <label for="output">结果</label>
        <textarea id="output" readonly placeholder="格式化后的 JSON 将显示在这里"></textarea>
        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const indent = document.getElementById('indent');
    const errorMsg = document.getElementById('errorMsg');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function setError(msg) {
      errorMsg.textContent = msg;
      input.classList.toggle('error', !!msg);
    }

    function formatJSON() {
      setError('');
      if (!input.value.trim()) {
        output.value = '';
        return;
      }
      try {
        const data = JSON.parse(input.value);
        const space = indent.value === '\\t' ? '\t' : parseInt(indent.value, 10);
        output.value = JSON.stringify(data, null, space);
      } catch (err) {
        output.value = '';
        setError('JSON 解析错误：' + err.message);
      }
    }

    function minifyJSON() {
      setError('');
      if (!input.value.trim()) {
        output.value = '';
        return;
      }
      try {
        const data = JSON.parse(input.value);
        output.value = JSON.stringify(data);
      } catch (err) {
        output.value = '';
        setError('JSON 解析错误：' + err.message);
      }
    }

    document.getElementById('formatBtn').addEventListener('click', formatJSON);
    document.getElementById('minifyBtn').addEventListener('click', minifyJSON);
    document.getElementById('clearBtn').addEventListener('click', () => {
      input.value = '';
      output.value = '';
      setError('');
      input.focus();
    });
    document.getElementById('copyBtn').addEventListener('click', async () => {
      if (!output.value) return;
      try {
        await navigator.clipboard.writeText(output.value);
        showToast('已复制到剪贴板');
      } catch (err) {
        output.select();
        document.execCommand('copy');
        showToast('已复制到剪贴板');
      }
    });
  </script>
</body>
</html>
